android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build memory.
#
# There was no jvmargs line here at all, so the daemon ran on Gradle's default heap. One flavour
# at a time fitted; asking for both in a single invocation did not, and the build died in
# lintVitalAnalyze and mergeDex with "Java heap space" — a failure that looks like a code problem
# and is not.
#
# HeapDumpOnOutOfMemoryError is OFF deliberately. AGP turns it on, and the dump lands in this
# directory: a 2.7 GB java_pid*.hprof written straight into the working tree, which is how a
# release once ended up in a commit that GitHub refused to accept. The OOM message alone says
# what is needed here; if a heap actually has to be inspected, turn it back on for that one run.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:-HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
