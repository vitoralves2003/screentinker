# AMBIENTE NOVO — Operacao. Espelha a producao, isolada dela em tudo:
# outro nome de container, outra porta, outro volume, outra imagem.
#
#   docker compose -p novo-operacao -f docker-compose.novo.yml up -d --build
#
# Escuta em 127.0.0.1:3110. O acesso e por tunel SSH; nao ha nginx nem
# dominio publico apontando para ca de proposito.

services:
  novo-operacao:
    build: .
    image: novo-operacao:latest
    container_name: novo-operacao
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3110:3001"
    volumes:
      # banco, uploads e o segredo gerado. Volume proprio: nada compartilhado
      # com o st-data da producao.
      - novo_operacao_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          # Metade do teto da producao: este ambiente e de teste e divide a
          # maquina com sete pilhas que estao no ar de verdade.
          cpus: "1.5"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # Duas redes: a propria, e a interna que a Gestao usa. E por ela que a Gestao pergunta
    # o resumo de telas -- servidor com servidor, sem sair da maquina e sem passar pela
    # porta publicada em 127.0.0.1.
    networks: [default, novo-interna]

  # ── O ENDERECO UNICO ──────────────────────────────────────────────────────────────────
  # Operacao na raiz, Gestao sob /gestao, API da Gestao sob /gestao-api. E isto que faz os
  # dois modulos deixarem de ser dois: mesma origem, mesmo localStorage, e a travessia entre
  # eles deixa de ser um login federado com tela de "Entrando..." no meio.
  #
  # E UM CONTAINER PROPRIO, e nao um arquivo no nginx do sistema, por decisao deliberada: o
  # nginx desta maquina serve SETE pilhas que estao no ar de verdade, e nao ha backup fora
  # da maquina. O arquivo de config e exatamente o que entra em producao no dia da virada --
  # entao isto e ensaio de verdade, nao maquete --, mas nenhum reload aqui toca o processo
  # que atende os sete.
  novo-proxy:
    image: nginx:1.27-alpine
    container_name: novo-proxy
    restart: unless-stopped
    depends_on: [novo-operacao]
    ports:
      # A unica porta do ambiente novo que o tunel precisa daqui em diante. As portas 3110,
      # 3120 e 3121 seguem publicadas por enquanto, para conferir um lado de cada vez.
      - "127.0.0.1:3100:80"
    volumes:
      - ./deploy/nginx-unificado.conf:/etc/nginx/conf.d/default.conf:ro
    # A rede interna e onde estao os tres: a Operacao e os dois containers da Gestao. O
    # proxy fala com todos por nome, sem sair da maquina.
    networks: [default, novo-interna]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  novo_operacao_data:

networks:
  novo-interna:
    name: novo-interna
    external: true
