# O ENDERECO DO SISTEMA UNIFICADO — beta.loopplayer.com.br
#
# Este arquivo mora no nginx do HOST (/etc/nginx/sites-enabled/), nao no novo-proxy. Sao dois
# nginx em serie, e a divisao de trabalho e proposital:
#
#   internet  ->  nginx do HOST      TLS, o certificado, e QUAL dominio vai para onde
#             ->  novo-proxy :3100   o corte por caminho entre as duas casas
#             ->  as duas casas
#
# O host nao sabe nada sobre o corte, e o novo-proxy nao sabe nada sobre TLS. Cada um tem um
# assunto, e mexer num nao arrisca o outro.
#
# ── POR QUE UM SUBDOMINIO NOVO, E NAO app./os. ──────────────────────────────────────────────
# app.loopplayer.com.br e os.loopplayer.com.br servem a PRODUCAO (containers loop-os-*, portas
# 4000/4001), que esta intocada. Apontar um deles para ca seria a virada -- e virada se faz
# depois de o Vitor usar o sistema unificado por um tempo, nao no mesmo dia em que ele ganha
# endereco. Ate la os dois convivem, e voltar atras e apagar um registro de DNS.
#
# ── O QUE ESTE ENDERECO DESTRAVA ────────────────────────────────────────────────────────────
#   a credencial do Google   ela grava a URL de retorno, entao depende de um endereco estavel
#                            -- e com ela sai a Etapa 7b (conta criada sozinho) e o 2o fator
#   o celular                hoje o sistema so abre por tunel SSH, no desktop
#   a borda do R2            o R2 como armazenamento ja funciona; o que esperava era a entrega
#
# ── INSTALAR ────────────────────────────────────────────────────────────────────────────────
#   1. o DNS aponta beta.loopplayer.com.br -> 89.117.77.234  (registro A) -- feito pelo Vitor
#   2. cp deploy/beta.loopplayer.com.br.conf /etc/nginx/sites-available/beta.loopplayer.com.br
#      ln -s ../sites-available/beta.loopplayer.com.br /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#   3. certbot --nginx -d beta.loopplayer.com.br
#      (o certbot reescreve este arquivo acrescentando o bloco 443 e o redirecionamento;
#       e por isso que ele nasce so com o :80 -- deixar o 443 escrito a mao antes do
#       certificado existir faz o nginx recusar a subir, e ai o site inteiro cai)

server {
    listen 80;
    listen [::]:80;
    server_name beta.loopplayer.com.br;

    # Video e imagem de campanha sobem por aqui. O padrao do nginx e 1 MB, que recusaria
    # praticamente todo arquivo de verdade -- com um 413 que o front nao explica.
    client_max_body_size 500M;

    # Um upload demora, e uma tela em campo pode ficar minutos sem falar. O padrao de 60s
    # cortaria os dois.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        # O novo-proxy, que faz o corte por caminho entre a casa nova e a velha.
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O canal ao vivo das telas. Sem estas tres linhas o socket.io cai para long-polling e
        # as telas param de receber comando na hora -- uma falha que nao aparece em pagina
        # nenhuma, so no atraso.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
