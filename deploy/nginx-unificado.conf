# UM ENDERECO SO — Operacao na raiz, Gestao sob /gestao.
#
# Este arquivo e o que faz os dois modulos deixarem de ser dois. Enquanto viverem em origens
# diferentes (app. e os.), cada travessia entre eles e um login federado em vez de uma
# navegacao, e a costura fica visivel: uma tela de "Entrando..." no meio do produto.
#
# MESMA ORIGEM SIGNIFICA MESMO localStorage. As duas sessoes passam a conviver no mesmo
# armazenamento do navegador, entao clicar em "Contratos" vira uma navegacao comum. A
# federacao continua existindo e continua necessaria -- e ela que provisiona a conta e
# carrega o papel na primeira entrada. O que muda e que ela deixa de aparecer.
#
# ── QUEM SE MOVE E A GESTAO ──────────────────────────────────────────────────────────────
# A Operacao NAO se move. O front dela usa caminhos absolutos (/css/, /assets/, /socket.io/)
# e, o que e decisivo, as telas em campo apontam para a raiz: mover a Operacao para um
# subcaminho exigiria reconfigurar painel por painel, alguns pendurados em teto de padaria.
# A Gestao e Next e suporta basePath, entao o custo de mover cai inteiro do lado que pode
# pagar.
#
# ── POR QUE /gestao ESTA LIVRE ───────────────────────────────────────────────────────────
# A Operacao tem 16 rotas de topo, conferidas no codigo e nao de memoria:
#   agency api app docs download media openapi player robots scripts sitemap socket sw
#   tizen uploads verificar
# Nenhuma comeca com "gestao". A regra para o futuro: antes de criar uma rota de topo nova
# na Operacao, olhar esta lista.
#
# ── ORDEM DAS REGRAS ─────────────────────────────────────────────────────────────────────
# nginx escolhe o prefixo MAIS LONGO, nao o primeiro que aparece, entao /gestao-api/ ganha de
# /gestao/ sem depender da ordem em que estao escritos aqui. Estao nesta ordem para quem le.

server {
    listen 80;
    server_name _;

    # ── POR QUE NAO HA BLOCO upstream AQUI ───────────────────────────────────────────────
    # Um `upstream x { server nome:porta; }` e resolvido UMA VEZ, quando o nginx sobe. Num
    # ambiente de containers o IP muda a cada rebuild, e o proxy passa a devolver 502 para
    # um servico que esta perfeitamente de pe -- ate alguem lembrar de reiniciar o proxy.
    # E uma falha que aparece como "a Gestao caiu" e nao e.
    #
    # 127.0.0.11 e o DNS interno do Docker. Com o destino guardado numa VARIAVEL, o nginx
    # resolve o nome a cada requisicao, entao reconstruir qualquer container nao derruba
    # nada. `valid=10s` limita o cache para que a troca seja notada em segundos.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $operacao   http://novo-operacao:3001;
    set $gestao_web http://novo-gestao-web:3000;
    set $gestao_api http://novo-gestao-api:3001;

    # Videos e imagens de campanha sobem por aqui. O padrao do nginx e 1 MB, que rejeitaria
    # praticamente todo arquivo de verdade -- com um 413 que o front nao explica.
    client_max_body_size 512m;

    # Um upload de video demora, e uma tela em campo pode ficar minutos sem falar. O padrao
    # de 60s cortaria os dois.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── A API DA GESTAO ──────────────────────────────────────────────────────────────────
    # O `rewrite` e o que TIRA /gestao-api do caminho antes de repassar: a API nao sabe que
    # vive sob um prefixo, e nao deveria saber. Sem ele, receberia /gestao-api/clients e
    # responderia 404 em tudo.
    #
    # Com destino em variavel nao da para usar o atalho da barra final (`proxy_pass http://
    # x/`), que so funciona com endereco literal -- dai o rewrite explicito. `break` para a
    # reescrita aqui, sem reentrar na escolha de location.
    location /gestao-api/ {
        rewrite ^/gestao-api/(.*)$ /$1 break;
        proxy_pass $gestao_api;
    }

    # ── A GESTAO (Next com basePath: '/gestao') ──────────────────────────────────────────
    # AQUI O PREFIXO NAO E CORTADO, de proposito: o Next foi construido esperando receber o
    # caminho COM /gestao. Cortar aqui quebraria todo link e todo asset dele.
    location = /gestao  { proxy_pass $gestao_web; }
    location   /gestao/ { proxy_pass $gestao_web; }

    # ── O CADASTRO PUBLICO, NO ENDERECO QUE SE IMPRIME ───────────────────────────────────
    # /cadastro/<slug> e o link que o assinante compartilha com anunciante — sai em papel,
    # WhatsApp e cartao. A pagina mora no Next da Gestao (app/cadastro/[slug]), ou seja, em
    # /gestao/cadastro/<slug> — e o link era montado SEM o prefixo, entao caia na Operacao:
    # quem estava logado via o painel dela, quem nao estava via a tela de login. O Vitor
    # reportou DUAS vezes ate eu entender qual link era.
    #
    # A reescrita poe o prefixo aqui, no proxy, em vez de por /gestao no link publico:
    # o endereco curto e o que sobrevive ao renome da Etapa 10, e link impresso nao se
    # conserta depois.
    location /cadastro/ {
        rewrite ^/cadastro/(.*)$ /gestao/cadastro/$1 break;
        proxy_pass $gestao_web;
    }

    # ══ O CORTE (Fase C, 02/09) ═══════════════════════════════════════════════════════════
    #
    # Aqui os caminhos PORTADOS passam a ser servidos pela casa nova. Este e o momento em que
    # a migracao deixa de ser codigo escrito e vira o produto rodando -- e por isso cada regra
    # abaixo esta aqui por uma medicao, nao por simetria.
    #
    # nginx casa o PREFIXO MAIS LONGO, nao a primeira regra escrita, entao os "location ="
    # abaixo ganham de qualquer prefixo, e os prefixos ganham do "location /" no fim. A ordem
    # deste arquivo e para quem le.
    #
    # O QUE VAI, e por que: sao os dominios cujo DADO ja mora no Postgres (Fases A e B) mais o
    # bloco de telas e socket (Fase C). Cada um tem prova verde no staging antes desta linha.
    #
    # O QUE FICA, e por que -- a lista importa tanto quanto a de cima:
    #   /api/auth, /api/menu, /api/configuracoes, /api/subscription ...  IDENTIDADE e COBRANCA,
    #       que nao foram migradas. A casa nova as le pelo espelho de 60s.
    #   /api/resumo/assinatura e /api/resumo/pessoas   idem: leem users, organization_members
    #       e workspace_invites. So /resumo/telas veio, porque le a FROTA.
    #   /api/player-debug   deposito de erro do player, lido so pelo #/admin/player-debug, que
    #       e pagina de plataforma e mora aqui.
    #   /api/provision (menos /pair)  o REGISTRO do aparelho por HTTP e o device-owner-qr.
    #
    # (Ate 02/09 /uploads/content tambem ficava. O motivo era bom: a casa nova escrevia nesse
    # volume mas nao sabia SERVI-LO com o endurecimento -- CSP sandbox, nosniff, attachment para
    # extensao nao-segura --, e o static dela apontava para outro volume. Cortar naquele dia
    # daria 404 em toda a biblioteca E serviria conteudo de usuario sem sandbox. O endurecimento
    # foi portado na Fase D (src/operacao/content/midia/servir-uploads.ts) e o caminho desceu
    # para a lista de cima.)

    location ^~ /api/layouts     { proxy_pass $gestao_api; }
    location ^~ /api/widgets     { proxy_pass $gestao_api; }
    location ^~ /api/content     { proxy_pass $gestao_api; }
    location ^~ /api/playlists   { proxy_pass $gestao_api; }
    location ^~ /api/devices     { proxy_pass $gestao_api; }
    location ^~ /api/assignments { proxy_pass $gestao_api; }
    location ^~ /api/pip         { proxy_pass $gestao_api; }

    # O PORTAL DO ANUNCIANTE E A FILA DE APROVACAO (Etapa 10). Nascem na casa nova e nunca
    # existiram na velha -- sem estas duas linhas elas caem no `location /` la embaixo e a casa
    # velha responde 404, que e indistinguivel de "a rota nao subiu".
    #
    # Foi exatamente o que aconteceu: o codigo estava no container, a suite verde, e a prova
    # contra o servidor respondeu 404 nas duas. Toda rota NOVA da casa nova precisa de uma linha
    # aqui, e o silencio dessa falta e o mesmo da "excecao deliberada" -- ninguem ve, porque um
    # 404 parece defeito do codigo.
    location ^~ /api/portal      { proxy_pass $gestao_api; }
    location ^~ /api/aprovacoes  { proxy_pass $gestao_api; }
    # Quem DA acesso ao portal (05/09). Fica na casa nova como as duas de cima, e pela mesma
    # razao: nasceu la e nunca existiu aqui. Sem esta linha ela cai no `location /` e a casa
    # velha responde 404 -- indistinguivel de "a rota nao subiu", que ja custou uma manha.
    location ^~ /api/clientes    { proxy_pass $gestao_api; }

    # OS BYTES QUE A TELA BAIXA. Ultimo caminho a atravessar, e o ultimo de proposito: nao e uma
    # rota, e um diretorio de arquivos ENVIADOS POR USUARIO servido da nossa propria origem.
    # A casa nova so o assumiu depois de saber servi-lo com o mesmo endurecimento da velha, e
    # de responder 404 JSON num miss -- porque um miss que caia num catch-all de HTML faz o
    # player guardar 15KB de pagina COMO SE FOSSE o video, por 30 dias, e exibir frame preto.
    location ^~ /uploads/content { proxy_pass $gestao_api; }

    # Exatos: so a folha portada atravessa, e o resto do galho fica.
    location = /api/provision/pair { proxy_pass $gestao_api; }
    location = /api/resumo/telas   { proxy_pass $gestao_api; }

    # O CANAL AO VIVO DAS TELAS. E a regra de maior risco do arquivo: a partir dela todo painel
    # em campo conecta na casa nova. As duas linhas de Upgrade sao obrigatorias -- sem elas o
    # socket.io cai para long-polling e as telas param de receber comando na hora, uma falha
    # que nao aparece em pagina nenhuma, so no atraso.
    location ^~ /socket.io {
        proxy_pass $gestao_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── TUDO O MAIS E A OPERACAO ─────────────────────────────────────────────────────────
    # Inclusive /app, /api, /player e /socket.io. As telas em campo caem aqui, na raiz, como
    # sempre cairam.
    location / {
        proxy_pass $operacao;

        # O canal ao vivo das telas. Sem estas duas linhas o socket.io cai para long-polling
        # e as telas param de receber comando na hora -- uma falha que nao aparece em
        # nenhuma pagina, so no atraso.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
