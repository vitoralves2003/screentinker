# UM ENDERECO SO — Operacao na raiz, Gestao sob /gestao.
#
# Este arquivo e o que faz os dois modulos deixarem de ser dois. Enquanto viverem em origens
# diferentes (app. e os.), cada travessia entre eles e um login federado em vez de uma
# navegacao, e a costura fica visivel: uma tela de "Entrando..." no meio do produto.
#
# MESMA ORIGEM SIGNIFICA MESMO localStorage. As duas sessoes passam a conviver no mesmo
# armazenamento do navegador, entao clicar em "Contratos" vira uma navegacao comum. A
# federacao continua existindo e continua necessaria -- e ela que provisiona a conta e
# carrega o papel na primeira entrada. O que muda e que ela deixa de aparecer.
#
# ── QUEM SE MOVE E A GESTAO ──────────────────────────────────────────────────────────────
# A Operacao NAO se move. O front dela usa caminhos absolutos (/css/, /assets/, /socket.io/)
# e, o que e decisivo, as telas em campo apontam para a raiz: mover a Operacao para um
# subcaminho exigiria reconfigurar painel por painel, alguns pendurados em teto de padaria.
# A Gestao e Next e suporta basePath, entao o custo de mover cai inteiro do lado que pode
# pagar.
#
# ── POR QUE /gestao ESTA LIVRE ───────────────────────────────────────────────────────────
# A Operacao tem 16 rotas de topo, conferidas no codigo e nao de memoria:
#   agency api app docs download media openapi player robots scripts sitemap socket sw
#   tizen uploads verificar
# Nenhuma comeca com "gestao". A regra para o futuro: antes de criar uma rota de topo nova
# na Operacao, olhar esta lista.
#
# ── ORDEM DAS REGRAS ─────────────────────────────────────────────────────────────────────
# nginx escolhe o prefixo MAIS LONGO, nao o primeiro que aparece, entao /gestao-api/ ganha de
# /gestao/ sem depender da ordem em que estao escritos aqui. Estao nesta ordem para quem le.

server {
    listen 80;
    server_name _;

    # ── POR QUE NAO HA BLOCO upstream AQUI ───────────────────────────────────────────────
    # Um `upstream x { server nome:porta; }` e resolvido UMA VEZ, quando o nginx sobe. Num
    # ambiente de containers o IP muda a cada rebuild, e o proxy passa a devolver 502 para
    # um servico que esta perfeitamente de pe -- ate alguem lembrar de reiniciar o proxy.
    # E uma falha que aparece como "a Gestao caiu" e nao e.
    #
    # 127.0.0.11 e o DNS interno do Docker. Com o destino guardado numa VARIAVEL, o nginx
    # resolve o nome a cada requisicao, entao reconstruir qualquer container nao derruba
    # nada. `valid=10s` limita o cache para que a troca seja notada em segundos.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $operacao   http://novo-operacao:3001;
    set $gestao_web http://novo-gestao-web:3000;
    set $gestao_api http://novo-gestao-api:3001;

    # Videos e imagens de campanha sobem por aqui. O padrao do nginx e 1 MB, que rejeitaria
    # praticamente todo arquivo de verdade -- com um 413 que o front nao explica.
    client_max_body_size 512m;

    # Um upload de video demora, e uma tela em campo pode ficar minutos sem falar. O padrao
    # de 60s cortaria os dois.
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── A API DA GESTAO ──────────────────────────────────────────────────────────────────
    # O `rewrite` e o que TIRA /gestao-api do caminho antes de repassar: a API nao sabe que
    # vive sob um prefixo, e nao deveria saber. Sem ele, receberia /gestao-api/clients e
    # responderia 404 em tudo.
    #
    # Com destino em variavel nao da para usar o atalho da barra final (`proxy_pass http://
    # x/`), que so funciona com endereco literal -- dai o rewrite explicito. `break` para a
    # reescrita aqui, sem reentrar na escolha de location.
    location /gestao-api/ {
        rewrite ^/gestao-api/(.*)$ /$1 break;
        proxy_pass $gestao_api;
    }

    # ── A GESTAO (Next com basePath: '/gestao') ──────────────────────────────────────────
    # AQUI O PREFIXO NAO E CORTADO, de proposito: o Next foi construido esperando receber o
    # caminho COM /gestao. Cortar aqui quebraria todo link e todo asset dele.
    location = /gestao  { proxy_pass $gestao_web; }
    location   /gestao/ { proxy_pass $gestao_web; }

    # ── O CADASTRO PUBLICO, NO ENDERECO QUE SE IMPRIME ───────────────────────────────────
    # /cadastro/<slug> e o link que o assinante compartilha com anunciante — sai em papel,
    # WhatsApp e cartao. A pagina mora no Next da Gestao (app/cadastro/[slug]), ou seja, em
    # /gestao/cadastro/<slug> — e o link era montado SEM o prefixo, entao caia na Operacao:
    # quem estava logado via o painel dela, quem nao estava via a tela de login. O Vitor
    # reportou DUAS vezes ate eu entender qual link era.
    #
    # A reescrita poe o prefixo aqui, no proxy, em vez de por /gestao no link publico:
    # o endereco curto e o que sobrevive ao renome da Etapa 10, e link impresso nao se
    # conserta depois.
    location /cadastro/ {
        rewrite ^/cadastro/(.*)$ /gestao/cadastro/$1 break;
        proxy_pass $gestao_web;
    }

    # ── TUDO O MAIS E A OPERACAO ─────────────────────────────────────────────────────────
    # Inclusive /app, /api, /player e /socket.io. As telas em campo caem aqui, na raiz, como
    # sempre cairam.
    location / {
        proxy_pass $operacao;

        # O canal ao vivo das telas. Sem estas duas linhas o socket.io cai para long-polling
        # e as telas param de receber comando na hora -- uma falha que nao aparece em
        # nenhuma pagina, so no atraso.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
