# O ENDERECO DO ATENDIMENTO — ajuda.loopplayer.com.br
#
#   internet  ->  nginx do HOST     TLS, o certificado, e qual dominio vai para onde
#             ->  atendimento-rails  127.0.0.1:3200
#
# Diferente do beta, aqui NAO ha um segundo nginx no meio: o atendimento e um sistema so, sem
# corte por caminho. O host fala direto com o container.
#
# ── UM ENDERECO, DOIS PUBLICOS ──────────────────────────────────────────────────────────────
#   /app    quem ATENDE -- o painel da nossa equipe
#   /hc     quem PRECISA -- a Central de Ajuda publica, que o Google indexa
# Mesmo dominio, caminhos diferentes. Por isso um registro de DNS bastou.
#
# ── INSTALAR (o 443 NAO se escreve a mao) ───────────────────────────────────────────────────
#   1. o DNS aponta ajuda.loopplayer.com.br -> 89.117.77.234 (registro A) -- feito pelo Vitor
#   2. cp deploy/atendimento/nginx-ajuda.loopplayer.com.br.conf \
#        /etc/nginx/sites-available/ajuda.loopplayer.com.br
#      ln -s ../sites-available/ajuda.loopplayer.com.br /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#   3. certbot --nginx -d ajuda.loopplayer.com.br
#
# O certbot REESCREVE este arquivo acrescentando o bloco 443 e o redirecionamento. Deixar o
# 443 escrito antes de o certificado existir faz o nginx recusar a subir -- e quando o nginx
# do host nao sobe, TODOS os enderecos da maquina caem juntos, nao so este.

server {
    server_name ajuda.loopplayer.com.br;

    # ── O CABECALHO COM UNDERSCORE ──────────────────────────────────────────────────────
    # O Chatwoot autentica pelo cabecalho `api_access_token` -- com UNDERSCORES. E o nginx,
    # por padrao, DESCARTA silenciosamente todo cabecalho que os tenha.
    #
    # Isso derrubou o robo inteiro em 20/09: ele decidia certo, montava a resposta e o
    # Chatwoot recusava com 401. Provado com duas chamadas identicas -- direto no atendimento
    # deu 200, pelo nginx deu 401.
    #
    # O modo de falha e o pior possivel: nada erra no caminho. O cabecalho simplesmente nao
    # chega, e quem recebe conclui que o token esta errado.
    underscores_in_headers on;

    # ── O TAMANHO DO ANEXO ──────────────────────────────────────────────────────────────
    # Cliente com problema manda print da tela, e as vezes um video curto do painel travando.
    # O padrao do nginx e 1 MB, que recusaria quase tudo -- com um 413 que a tela do Chatwoot
    # nao explica, e que a pessoa le como "o site nao funciona".
    client_max_body_size 40M;

    # ── A CONVERSA E AO VIVO ────────────────────────────────────────────────────────────
    # Quem atende fica com a tela aberta esperando o cliente digitar. O padrao de 60s cortaria
    # a conexao a cada minuto de silencio, e a conversa passaria a chegar atrasada -- uma
    # falha que se apresenta como "o sistema esta lento", nunca como "a conexao caiu".
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── ActionCable: o CANAL que traz a mensagem sem recarregar a pagina ────────────────
    # Sem o par Upgrade/Connection abaixo, o Chatwoot ABRE e funciona -- e a mensagem nova so
    # aparece quando alguem aperta F5. E o modo de falha mais enganoso deste arquivo, porque
    # nada erra: apenas nada chega sozinho.
    location /cable {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── A NOSSA FOLHA DENTRO DO QUADRO DO CHAT ──────────────────────────────────────────
    # O quadro da conversa e uma pagina SEPARADA, servida por este endereco e encaixada no
    # painel. A folha de estilo do painel nao atravessa essa fronteira, entao tudo o que
    # aparece la dentro era pintado pelo Chatwoot -- e ele so aceita UMA cor.
    #
    # ── POR QUE UMA COR SO NAO BASTAVA ──────────────────────────────────────────────────
    # Ele usa esse mesmo valor em dois papeis opostos: como FUNDO da fala do cliente e como
    # LETRA do botao de resposta sobre branco. Fundo pede uma cor que aceite texto legivel;
    # letra sobre branco pede uma cor escura. Em 20/09 eu clareei a cor para o texto da fala
    # sair preto (#70EBB9) e o botao "Falar com uma pessoa" foi junto: 1,47:1, invisivel.
    #
    # ── O ARRANJO QUE DESFAZ O EMPATE ───────────────────────────────────────────────────
    #   a cor guardada no Chatwoot  ->  #047857, o verde que se LE (5,48:1 sobre branco)
    #   esta folha                  ->  promove so os FUNDOS ao verde vivo, com tinta preta
    #
    # Assim todo lugar onde a cor vira letra ja nasce legivel, sem regra nenhuma, e a marca
    # aparece onde ela deve aparecer. Sao tres regras em vez de uma por componente -- e
    # regra que nao existe nao pode mirar errado, que foi como o botao ficou largo no
    # celular em 20/09 (`woot--expanded` nao existe; a real e `woot-widget--expanded`).
    #
    # As classes abaixo foram LIDAS em UserMessageBubble.vue, UserMessage.vue e
    # FileBubble.vue dentro do container, nao presumidas. O `!important` e necessario e
    # suficiente: o Chatwoot escreve a cor no proprio elemento, e folha de autor com
    # !important vence estilo de elemento sem ele.
    #
    # Se um dia o Chatwoot renomear essas classes, a folha deixa de pegar e a fala volta ao
    # verde escuro -- legivel, so sem a marca. Aparece na tela na hora; nao ha modo de falha
    # silencioso aqui.
    #
    # ── OS MARCADORES ABAIXO NAO SAO ENFEITE ────────────────────────────────────────────
    # Este arquivo NAO pode ser copiado por cima do que esta em producao: o certbot
    # reescreveu aquele acrescentando o bloco 443 e o redirecionamento, e nada disso existe
    # aqui. Copiar derrubaria o HTTPS do atendimento inteiro.
    #
    # Por isso o trecho abaixo e INSERIDO, e nao copiado, por
    # `deploy/atendimento/instalar-folha-do-chat.py`, que o recorta entre estes marcadores.
    # Recortar por marcador e nao por contagem de chaves e deliberado: o CSS aqui dentro tem
    # chaves, e contar chaves levaria o bloco pela metade.
    # >>> FOLHA DO CHAT
    location = /widget {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SEM ISTO A FOLHA NAO ENTRA. O Chatwoot devolve a pagina compactada, e nao ha como
        # acrescentar texto a um corpo compactado -- o nginx simplesmente repassa e nada
        # acontece, sem erro. Pedindo sem compactacao, ele reescreve e compacta de novo na
        # saida (gzip on, no nginx.conf), entao para quem abre a pagina nada muda.
        proxy_set_header Accept-Encoding "";

        sub_filter_once on;
        sub_filter '</head>' '<style>
.chat-bubble.user,
.chat-bubble.has-attachment.user {
  background: #20DF91 !important;
  color: #000000 !important;
}
.chat-bubble.user .file .icon-wrap,
.chat-bubble.user .file p,
.chat-bubble.user .file .download {
  color: #000000 !important;
}
</style></head>';
    }
    # <<< FOLHA DO CHAT

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # O Rails monta os links dele a partir deste cabecalho. Sem ele, o Chatwoot acha que
        # esta em http e gera link http numa pagina https -- o navegador recusa e a tela
        # quebra pela metade, sem erro no servidor.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 80;
}
