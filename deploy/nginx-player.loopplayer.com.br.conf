# Loop OS — public entry point for player.loopplayer.com.br
#
# Install:
#   cp deploy/nginx-player.loopplayer.com.br.conf /etc/nginx/sites-available/player.loopplayer.com.br
#   ln -sf /etc/nginx/sites-available/player.loopplayer.com.br /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The TLS certificate is managed by certbot and already exists for this hostname.

server {
    server_name player.loopplayer.com.br;

    # Uploads are the large requests here. This MUST be at least as large as the app's own
    # MAX_FILE_SIZE (default 500MB) or nginx returns 413 before the request ever reaches the
    # container — raising the app limit alone does nothing.
    client_max_body_size 500M;

    # A 500MB upload over a slow link takes a while; the defaults (60s) would cut it off.
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # Socket.IO: the device and dashboard namespaces are long-lived WebSockets. Without the
        # Upgrade/Connection pair they silently fall back to polling, and every panel reconnects
        # on a loop.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app trusts this to know it is behind TLS (secure cookies, absolute URLs).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Players hold their socket open indefinitely; the 60s default would tear a healthy
        # connection down every minute and produce exactly the reconnect churn the app's own
        # ping/pong tuning exists to avoid.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/player.loopplayer.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/player.loopplayer.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name player.loopplayer.com.br;
    return 301 https://$host$request_uri;
}
